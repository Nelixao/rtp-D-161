<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTP 161-D — Registro</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #1a1a1a;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 20px;
        min-height: 100vh;
    }
    .contenedor { max-width: 500px; margin: 0 auto; }
    .titulo { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; color: #bbb; }
    .subtitulo { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
    .card {
        background: #111;
        border-radius: 16px;
        padding: 20px;
        border: 1px solid #222;
    }
    label {
        display: block;
        color: #aaa;
        font-size: 0.85rem;
        margin-bottom: 6px;
        margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }
    select, input, textarea {
        width: 100%;
        background: #000;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px 14px;
        color: #fff;
        font-size: 1rem;
        outline: none;
        font-family: inherit;
    }
    select:focus, input:focus, textarea:focus { border-color: #4ade80; }
    .fila-hora {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
    }
    .btn-guardar {
        width: 100%;
        background: #22c55e;
        color: #052e16;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 700;
        margin-top: 20px;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-guardar:hover { background: #16a34a; }
    .btn-guardar:active { transform: scale(0.98); }

    .lista-registros { margin-top: 30px; }
    .cabecera-lista {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #333;
    }
    .nombre-parada { font-size: 1.1rem; font-weight: 600; color: #ddd; }
    .badges { display: flex; gap: 6px; margin-top: 4px; }
    .badge {
        padding: 2px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    .badge-ida { background: #222; color: #fff; }
    .badge-dia { background: #facc15; color: #422006; }
    .badge-prom {
        background: #222;
        color: #4ade80;
        font-size: 0.85rem;
        padding: 6px 12px;
        border-radius: 20px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th {
        text-align: left;
        color: #888;
        font-size: 0.85rem;
        padding: 10px 0;
        border-bottom: 1px solid #333;
    }
    td { padding: 14px 0; border-bottom: 1px solid #222; font-size: 0.95rem; }
    .btn-borrar {
        background: none;
        border: none;
        color: #ef4444;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>
<div class="contenedor">
    <div class="titulo">🚌 RTP 161-D — Registro</div>
    <div class="subtitulo">Guarda las horas que vives en cada parada y compáralas por día.</div>

    <div class="card">
        <label>Dirección</label>
        <select id="selectDireccion">
            <option value="">-- Cargando... --</option>
        </select>

        <label>Parada</label>
        <select id="selectParada">
            <option value="">-- Cargando... --</option>
        </select>

        <label>Día</label>
        <select id="selectDia">
            <option>Lunes</option>
            <option>Martes</option>
            <option>Miércoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
            <option>Sábado</option>
            <option selected>Domingo</option>
        </select>

        <label>Hora</label>
        <div class="fila-hora">
            <select id="selectHora"></select>
            <select id="selectMinuto"></select>
            <select id="selectAmPm">
                <option>AM</option>
                <option>PM</option>
            </select>
        </div>

        <label>Nota (opcional)</label>
        <textarea id="inputNota" rows="2" placeholder="ej. iba lleno, con tráfico..."></textarea>

        <button class="btn-guardar" id="btnGuardar">Guardar registro</button>
    </div>

    <div class="lista-registros">
        <div class="cabecera-lista">
            <div>
                <div class="nombre-parada" id="nombreParada">—</div>
                <div class="badges">
                    <span class="badge badge-ida" id="badgeDir">—</span>
                    <span class="badge badge-dia" id="badgeDia">—</span>
                </div>
            </div>
            <div class="badge-prom" id="badgeProm">0 reg</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Nota</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tablaRegistros"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "/api";

    // --- Llenar selects de hora y minutos ---
    const selectHora = document.getElementById('selectHora');
    const selectMinuto = document.getElementById('selectMinuto');
    for (let h = 1; h <= 12; h++) {
        const opt = document.createElement('option');
        opt.value = String(h).padStart(2, '0');
        opt.textContent = String(h).padStart(2, '0');
        selectHora.appendChild(opt);
    }
    for (let m = 0; m < 60; m++) {
        const opt = document.createElement('option');
        opt.value = String(m).padStart(2, '0');
        opt.textContent = String(m).padStart(2, '0');
        selectMinuto.appendChild(opt);
    }
    selectHora.value = "07";
    selectMinuto.value = "30";

    // --- Cargar rutas al inicio ---
    async function cargarRutas() {
        try {
            const resp = await fetch(`${API_URL}/rutas`);
            const rutas = await resp.json();

            const select = document.getElementById('selectDireccion');
            select.innerHTML = '';
            rutas.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.nombre} → ${r.descripcion}`;
                select.appendChild(opt);
            });

            // Después de cargar rutas, cargar paradas
            await cargarParadas();
        } catch (err) {
            console.error('Error cargando rutas:', err);
        }
    }

    // --- Cargar paradas según la ruta seleccionada ---
    async function cargarParadas() {
        const ruta_id = document.getElementById('selectDireccion').value;
        const selectParada = document.getElementById('selectParada');

        if (!ruta_id) return;

        try {
            const resp = await fetch(`${API_URL}/paradas?ruta_id=${ruta_id}`);
            const paradas = await resp.json();

            selectParada.innerHTML = '';
            paradas.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.nombre;
                selectParada.appendChild(opt);
            });

            // Después de cargar paradas, cargar registros
            await cargarRegistros();
        } catch (err) {
            console.error('Error cargando paradas:', err);
        }
    }

    // --- Guardar registro ---
    document.getElementById('btnGuardar').addEventListener('click', async () => {
        const ruta_id = document.getElementById('selectDireccion').value;
        const parada_id = document.getElementById('selectParada').value;
        const dia = document.getElementById('selectDia').value;
        const hora12 = document.getElementById('selectHora').value;
        const minuto = document.getElementById('selectMinuto').value;
        const ampm = document.getElementById('selectAmPm').value;
        const nota = document.getElementById('inputNota').value;

        if (!parada_id) {
            alert('Selecciona una parada');
            return;
        }

        // Convertir a formato 24h
        let h = parseInt(hora12);
        if (ampm === 'PM' && h !== 12) h += 12;
        if (ampm === 'AM' && h === 12) h = 0;
        const hora24 = String(h).padStart(2, '0') + ':' + minuto;

        const datos = { parada_id, ruta_id, dia, hora: hora24, nota };

        try {
            const resp = await fetch(`${API_URL}/guardar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            const resultado = await resp.json();
            if (resp.ok) {
                document.getElementById('inputNota').value = '';
                cargarRegistros();
            } else {
                alert('Error: ' + (resultado.error || 'desconocido'));
            }
        } catch (err) {
            alert('No se pudo conectar al servidor: ' + err.message);
        }
    });

    // --- Cargar registros ---
    async function cargarRegistros() {
        const ruta_id = document.getElementById('selectDireccion').value;
        const parada_id = document.getElementById('selectParada').value;
        const dia = document.getElementById('selectDia').value;

        if (!parada_id || !ruta_id) return;

        // Actualizar badges
        const paradaTexto = document.getElementById('selectParada').selectedOptions[0]?.textContent || '—';
        const dirTexto = document.getElementById('selectDireccion').selectedOptions[0]?.textContent.split('→')[0].trim() || '—';

        document.getElementById('nombreParada').textContent = paradaTexto;
        document.getElementById('badgeDir').textContent = dirTexto;
        document.getElementById('badgeDia').textContent = dia;

        try {
            const resp = await fetch(
                `${API_URL}/registros?parada_id=${parada_id}&ruta_id=${ruta_id}&dia=${encodeURIComponent(dia)}`
            );
            const registros = await resp.json();

            const tbody = document.getElementById('tablaRegistros');
            tbody.innerHTML = '';
            let promedioTexto = '0 reg';

            registros.forEach(reg => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${reg.hora}</td>
                    <td>${reg.nota || '—'}</td>
                    <td><button class="btn-borrar" onclick="borrarRegistro(${reg.id})">✕</button></td>
                `;
                tbody.appendChild(fila);
                if (reg.promedio) {
                    promedioTexto = `${registros.length} reg · prom ${reg.promedio}`;
                }
            });

            document.getElementById('badgeProm').textContent = promedioTexto;
        } catch (err) {
            console.error('Error cargando registros:', err);
        }
    }

    // --- Borrar registro ---
    async function borrarRegistro(id) {
        if (!confirm('¿Borrar este registro?')) return;
        try {
            await fetch(`${API_URL}/borrar/${id}`, { method: 'DELETE' });
            cargarRegistros();
        } catch (err) {
            alert('No se pudo borrar');
        }
    }

    // --- Eventos ---
    document.getElementById('selectDireccion').addEventListener('change', cargarParadas);
    document.getElementById('selectParada').addEventListener('change', cargarRegistros);
    document.getElementById('selectDia').addEventListener('change', cargarRegistros);

    // --- Iniciar todo ---
    cargarRutas();
</script>
</body>
</html>
