<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTP 161-D — Predecir</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/graficas.css">
<style>
    /* ============ LAYOUT PREDECIR ============ */
    .pred-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 20px;
    }

    @media (min-width: 720px) {
        .pred-grid-2 {
            grid-template-columns: 1fr 1fr;
        }
    }

    /* Bloque destacado: próximo camión */
    .proximo-card {
        background: linear-gradient(135deg, rgba(74,222,128,0.25) 0%, rgba(34,197,94,0.12) 100%);
        border: 2px solid rgba(74,222,128,0.5);
        border-radius: 20px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(74,222,128,0.2);
        position: relative;
        overflow: hidden;
    }
    .proximo-card::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(74,222,128,0.1) 0%, transparent 70%);
        pointer-events: none;
    }
    .proximo-label {
        color: rgba(255,255,255,0.7);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
        position: relative;
    }
    .proximo-hora {
        color: #4ade80;
        font-size: 3.5rem;
        font-weight: 800;
        margin: 8px 0;
        line-height: 1;
        letter-spacing: -2px;
        text-shadow: 0 0 30px rgba(74,222,128,0.5);
        position: relative;
    }
    .proximo-espera {
        color: rgba(255,255,255,0.85);
        font-size: 1.1rem;
        position: relative;
    }
    .proximo-espera b { color: #4ade80; }
    .proximo-detalle {
        color: rgba(255,255,255,0.5);
        font-size: 0.75rem;
        margin-top: 12px;
        position: relative;
    }
    .proximo-sin {
        text-align: center;
        color: rgba(255,255,255,0.6);
        padding: 30px;
    }

    /* Filtros horizontales */
    .filtros {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }
    @media (min-width: 600px) {
        .filtros {
            grid-template-columns: 1fr 1fr 1fr;
        }
    }

    /* Info boxes */
    .info-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .info-item {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 12px 10px;
        text-align: center;
    }
    .info-label {
        color: rgba(255,255,255,0.5);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }
    .info-value {
        color: #60a5fa;
        font-size: 1.15rem;
        font-weight: 700;
    }
    .info-value.chico { font-size: 0.95rem; }

    /* Llegadas */
    .llegada-item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        margin-bottom: 8px;
        transition: background 0.2s;
    }
    .llegada-item.real {
        background: rgba(74,222,128,0.12);
        border-color: rgba(74,222,128,0.35);
    }
    .llegada-hora {
        font-size: 1.15rem;
        font-weight: 700;
        color: #fff;
    }
    .llegada-sub {
        font-size: 0.72rem;
        color: rgba(255,255,255,0.5);
        margin-top: 2px;
    }
    .llegada-badge {
        background: rgba(74,222,128,0.2);
        color: #4ade80;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 6px;
        text-transform: uppercase;
    }

    /* Mapa */
    .mapa-wrap {
        position: relative;
        width: 100%;
        height: 240px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
    }

    /* Header de sección */
    .seccion-titulo {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
    }
    .seccion-desc {
        color: rgba(255,255,255,0.5);
        font-size: 0.8rem;
        margin-bottom: 14px;
    }

    /* Cabecera card (con icono y título) */
    .card-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
    }
</style>
</head>

<body>
<div class="contenedor">

    <!-- NAV -->
    <div class="nav">
        <a href="/">📝 Registrar</a>
        <a href="/graficas">📊 Gráficas</a>
        <a href="/predecir" class="activo">🔮 Predecir</a>
    </div>

    <!-- TÍTULO -->
    <div class="titulo">🔮 Predicción de llegada</div>
    <div class="subtitulo">Calcula cuándo pasará el camión por tu parada.</div>

    <!-- FILTROS -->
    <div class="card">
        <div class="filtros">
            <div>
                <label>Dirección</label>
                <select id="selectDireccion">
                    <option value="">-- Cargando... --</option>
                </select>
            </div>
            <div>
                <label>Parada</label>
                <select id="selectParada">
                    <option value="">-- Cargando... --</option>
                </select>
            </div>
            <div>
                <label>Día</label>
                <select id="selectDia">
                    <option>Lunes</option>
                    <option>Martes</option>
                    <option>Miércoles</option>
                    <option>Jueves</option>
                    <option>Viernes</option>
                    <option>Sábado</option>
                    <option selected>Domingo</option>
                </select>
            </div>
        </div>
    </div>

    <!-- PRÓXIMO CAMIÓN (bloque destacado, se llena con JS) -->
    <div id="proximoCamion"></div>

    <!-- GRID: MAPA + INFO -->
    <div class="pred-grid pred-grid-2">

        <!-- MAPA -->
        <div class="grafica-card" style="padding: 16px;">
            <div class="card-head">
                <div>
                    <div class="seccion-titulo">🗺️ Mapa de la ruta</div>
                    <div class="seccion-desc">Parajes ↔ Central de Abasto · $2.00</div>
                </div>
                <a href="https://www.google.com/maps/d/u/0/viewer?mid=17tZYRt6vHc9kQsKGKThZmIHdQt4vfnTO" 
                   target="_blank"
                   style="color: #4ade80; text-decoration: none; font-size: 0.75rem; font-weight: 600; white-space: nowrap;">
                    Abrir ↗
                </a>
            </div>
            <div class="mapa-wrap">
                <iframe 
                    src="https://www.google.com/maps/d/u/0/embed?mid=17tZYRt6vHc9kQsKGKThZmIHdQt4vfnTO&ll=19.354214714627243%2C-99.06432292720336&z=13&gestureHandling=cooperative"
                    width="100%" 
                    height="100%" 
                    style="border: 0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>

        <!-- INFO DE LA RUTA -->
        <div id="infoRuta"></div>
    </div>

    <!-- STATS REALES -->
    <div id="statsReales"></div>

    <!-- LLEGADAS -->
    <div id="llegadas"></div>

</div>

<script src="/static/predecir.js"></script>
</body>
</html>
