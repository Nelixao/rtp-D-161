<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTP 161-D — Predecir</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/graficas.css">
<style>
    .llegada-item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        margin-bottom: 8px;
    }
    .llegada-item.real {
        background: rgba(74,222,128,0.12);
        border-color: rgba(74,222,128,0.35);
    }
    .llegada-item.proxima {
        background: rgba(250,204,21,0.12);
        border-color: rgba(250,204,21,0.4);
        box-shadow: 0 4px 20px rgba(250,204,21,0.15);
    }
    .llegada-hora {
        font-size: 1.2rem;
        font-weight: 700;
        color: #fff;
    }
    .llegada-sub {
        font-size: 0.75rem;
        color: rgba(255,255,255,0.5);
        margin-top: 2px;
    }
    .llegada-badge {
        background: rgba(74,222,128,0.2);
        color: #4ade80;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 6px;
        text-transform: uppercase;
    }
    .info-box {
        background: rgba(96,165,250,0.1);
        border: 1px solid rgba(96,165,250,0.25);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    .info-item {
        text-align: center;
    }
    .info-label {
        color: rgba(255,255,255,0.5);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .info-value {
        color: #60a5fa;
        font-size: 1.3rem;
        font-weight: 700;
        margin-top: 4px;
    }
</style>
</head>

<body>
<div class="contenedor">
    <div class="nav">
        <a href="/">📝 Registrar</a>
        <a href="/graficas">📊 Gráficas</a>
        <a href="/predecir" class="activo">🔮 Predecir</a>
    </div>

    <div class="titulo">🔮 Predicción de llegada</div>
    <div class="subtitulo">Calcula cuándo pasará el camión por tu parada.</div>

    <!-- Selectores -->
    <div class="card">
        <label>Dirección</label>
        <select id="selectDireccion">
            <option value="">-- Cargando... --</option>
        </select>

        <label>Parada</label>
        <select id="selectParada">
            <option value="">-- Cargando... --</option>
        </select>

        <label>Día</label>
        <select id="selectDia">
            <option>Lunes</option>
            <option>Martes</option>
            <option>Miércoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
            <option>Sábado</option>
            <option selected>Domingo</option>
        </select>
    </div>

    <!-- Mapa de la ruta (compacto) -->
    <div class="grafica-card" style="padding: 14px;">
        <h3 style="margin-bottom: 8px;">🗺️ Mapa de la ruta</h3>
        <div style="position: relative; width: 100%; height: 220px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);">
            <iframe 
                src="https://www.google.com/maps/d/u/0/embed?mid=17tZYRt6vHc9kQsKGKThZmIHdQt4vfnTO&ll=19.354214714627243%2C-99.06432292720336&z=13&gestureHandling=none"
                width="100%" 
                height="100%" 
                style="border: 0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
            <div style="color: rgba(255,255,255,0.5); font-size: 0.75rem;">
                Parajes ↔ Central de Abasto · $2.00
            </div>
            <a href="https://www.google.com/maps/d/u/0/viewer?mid=17tZYRt6vHc9kQsKGKThZmIHdQt4vfnTO" 
               target="_blank"
               style="color: #4ade80; text-decoration: none; font-size: 0.75rem; font-weight: 600;">
                Ver completo ↗
            </a>
        </div>
    </div>

    <!-- Info de la ruta (dinámica, la llena el JS) -->
    <div id="infoRuta"></div>

    <!-- Stats reales (dinámica) -->
    <div id="statsReales"></div>

    <!-- Llegadas (dinámica) -->
    <div id="llegadas"></div>
</div>

<script src="/static/predecir.js"></script>
</body>
</html>
